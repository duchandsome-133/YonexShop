<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <div th:replace="~{layout/admin :: html}" th:with="adminContent=~{::#productsAdminContent}, pageTitle='Quản Lý Sản Phẩm', activeNav='products'}">
        <div id="productsAdminContent">

            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
                <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
                    <h5 class="fw-bold text-navy mb-0">Danh Sách Sản Phẩm Yonex</h5>
                    <a th:href="@{/admin/products/create}" class="btn btn-yonex-primary rounded-pill btn-sm px-4">
                        <i class="bi bi-plus-lg me-1"></i> Thêm sản phẩm mới
                    </a>
                </div>

                <!-- Filters -->
                <form th:action="@{/admin/products}" method="get" class="row g-2 mb-4">
                    <div class="col-md-5">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                            <input type="text" name="keyword" class="form-control" placeholder="Tìm theo tên sản phẩm, mã SKU..." th:value="${keyword}">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <select name="categoryId" class="form-select form-select-sm">
                            <option value="">-- Tất cả danh mục --</option>
                            <option th:each="cat : ${categories}" th:value="${cat.categoryId}" 
                                    th:text="${cat.name}" th:selected="${categoryId == cat.categoryId}">Danh mục</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex gap-2">
                        <button type="submit" class="btn btn-primary btn-sm rounded-pill px-3">Lọc</button>
                        <a th:href="@{/admin/products}" class="btn btn-light btn-sm rounded-pill px-3">Đặt lại</a>
                    </div>
                </form>

                <!-- Table -->
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 80px;">Ảnh</th>
                                <th>Mã SKU</th>
                                <th>Tên sản phẩm</th>
                                <th>Danh mục</th>
                                <th>Giá bán</th>
                                <th>Tồn kho</th>
                                <th>Trạng thái</th>
                                <th class="text-end" style="width: 160px;">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${products}">
                                <td>
                                    <img th:src="${p.primaryImageUrl}" th:alt="${p.name}" 
                                         class="rounded p-1 border object-fit-contain" style="width: 50px; height: 50px;">
                                </td>
                                <td class="fw-bold text-dark small" th:text="${p.sku}">SKU</td>
                                <td>
                                    <strong class="text-dark d-block" th:text="${p.name}">Tên sản phẩm</strong>
                                    <span class="text-muted small" th:text="${#lists.size(p.variants)} + ' biến thể'">1 biến thể</span>
                                </td>
                                <td>
                                    <span class="badge bg-light text-secondary border small" th:text="${p.category.name}">Danh mục</span>
                                </td>
                                <td class="fw-bold text-primary" 
                                    th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                    0 đ
                                </td>
                                <td>
                                    <span class="badge bg-success-subtle text-success" th:if="${p.totalAvailableQuantity > 0}" th:text="${p.totalAvailableQuantity} + ' cái'">10</span>
                                    <span class="badge bg-danger-subtle text-danger" th:if="${p.totalAvailableQuantity <= 0}">Hết hàng</span>
                                </td>
                                <td>
                                    <span class="badge bg-success" th:if="${p.active}">Đang bán</span>
                                    <span class="badge bg-secondary" th:if="${!p.active}">Đang ẩn</span>
                                </td>
                                <td class="text-end">
                                    <div class="d-inline-flex gap-1">
                                        <a th:href="@{'/admin/products/edit/' + ${p.productId}}" class="btn btn-sm btn-outline-primary" title="Sửa">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:action="@{'/admin/products/toggle/' + ${p.productId}}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm" th:classappend="${p.active ? 'btn-outline-warning' : 'btn-outline-success'}" 
                                                    th:title="${p.active ? 'Ẩn sản phẩm' : 'Hiện sản phẩm'}">
                                                <i class="bi" th:classappend="${p.active ? 'bi-eye-slash' : 'bi-eye'}"></i>
                                            </button>
                                        </form>
                                        <form th:action="@{'/admin/products/delete/' + ${p.productId}}" method="post" class="d-inline"
                                              onsubmit="return confirm('Bạn có chắc chắn muốn ngừng kinh doanh sản phẩm này?')">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Ngừng kinh doanh">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(products)}">
                                <td colspan="8" class="text-center py-4 text-muted">Không tìm thấy sản phẩm nào.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <nav class="mt-4" th:if="${totalPages > 1}">
                    <ul class="pagination pagination-sm justify-content-center">
                        <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/admin/products(page=${currentPage - 1}, keyword=${keyword}, categoryId=${categoryId})}">&laquo;</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i ? 'active' : ''}">
                            <a class="page-link" th:href="@{/admin/products(page=${i}, keyword=${keyword}, categoryId=${categoryId})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/admin/products(page=${currentPage + 1}, keyword=${keyword}, categoryId=${categoryId})}">&raquo;</a>
                        </li>
                    </ul>
                </nav>
            </div>

        </div>
    </div>
</body>
</html>
