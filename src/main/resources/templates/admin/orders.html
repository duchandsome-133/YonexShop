<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <div th:replace="~{layout/admin :: html}" th:with="adminContent=~{::#ordersAdminContent}, pageTitle='Quản Lý Đơn Hàng', activeNav='orders'}">
        <div id="ordersAdminContent">

            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
                <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
                    <div>
                        <h5 class="fw-bold text-navy mb-0">Danh Sách Đơn Hàng COD</h5>
                        <p class="text-muted small mb-0">Theo dõi, xác nhận và cập nhật tiến trình giao hàng</p>
                    </div>
                </div>

                <!-- Filters -->
                <form th:action="@{/admin/orders}" method="get" class="row g-2 mb-4">
                    <div class="col-md-5">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                            <input type="text" name="keyword" class="form-control" placeholder="Tìm theo mã đơn, tên khách, số điện thoại..." th:value="${keyword}">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <select name="status" class="form-select form-select-sm">
                            <option value="">-- Tất cả trạng thái --</option>
                            <option th:each="st : ${orderStatuses}" th:value="${st.name()}" 
                                    th:text="${st.displayName}" th:selected="${selectedStatus != null and selectedStatus.name() == st.name()}">
                                Trạng thái
                            </option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex gap-2">
                        <button type="submit" class="btn btn-primary btn-sm rounded-pill px-3">Lọc đơn</button>
                        <a th:href="@{/admin/orders}" class="btn btn-light btn-sm rounded-pill px-3">Đặt lại</a>
                    </div>
                </form>

                <!-- Orders Table -->
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Mã đơn</th>
                                <th>Khách hàng</th>
                                <th>Số điện thoại</th>
                                <th>Thời gian đặt</th>
                                <th>Tổng thanh toán</th>
                                <th>Phương thức</th>
                                <th>Trạng thái</th>
                                <th class="text-end" style="width: 120px;">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="o : ${orders}">
                                <td class="fw-bold text-dark" th:text="'#' + ${o.orderCode}">#YNX123</td>
                                <td class="fw-semibold text-dark" th:text="${o.recipientName}">Tên</td>
                                <td class="text-muted small" th:text="${o.recipientPhone}">090...</td>
                                <td class="text-muted small" th:text="${#temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm')}">22/11/2026</td>
                                <td class="fw-bold text-primary" 
                                    th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                    0 đ
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border">COD</span>
                                </td>
                                <td>
                                    <span class="status-badge" th:classappend="'status-' + ${o.orderStatus.name()}" 
                                          th:text="${o.orderStatus.displayName}">Chờ</span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{'/admin/orders/' + ${o.orderId}}" class="btn btn-sm btn-outline-primary rounded-pill px-3">
                                        Chi tiết
                                    </a>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(orders)}">
                                <td colspan="8" class="text-center py-4 text-muted">Không có đơn hàng nào phù hợp với bộ lọc.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <nav class="mt-4" th:if="${totalPages > 1}">
                    <ul class="pagination pagination-sm justify-content-center">
                        <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/admin/orders(page=${currentPage - 1}, keyword=${keyword}, status=${selectedStatus})}">&laquo;</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i ? 'active' : ''}">
                            <a class="page-link" th:href="@{/admin/orders(page=${i}, keyword=${keyword}, status=${selectedStatus})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/admin/orders(page=${currentPage + 1}, keyword=${keyword}, status=${selectedStatus})}">&raquo;</a>
                        </li>
                    </ul>
                </nav>
            </div>

        </div>
    </div>
</body>
</html>
