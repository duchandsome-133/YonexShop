<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <div th:replace="~{layout/admin :: adminLayout(~{::#productFormContent}, 'products')}">
        <div id="productFormContent">

            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold text-navy mb-0" th:text="${productRequest.productId != null ? 'Chỉnh Sửa Sản Phẩm #' + productRequest.sku : 'Thêm Sản Phẩm Mới'}">Thêm Sản Phẩm</h5>
                    <a th:href="@{/admin/products}" class="btn btn-outline-secondary rounded-pill btn-sm px-3">
                        <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách
                    </a>
                </div>

                <form th:action="${productRequest.productId != null ? '/admin/products/edit/' + productRequest.productId : '/admin/products/create'}" 
                      th:object="${productRequest}" method="post" enctype="multipart/form-data">

                    <input type="hidden" th:field="*{productId}" th:if="*{productId != null}">

                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label small fw-bold">Tên sản phẩm <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{name}" placeholder="Ví dụ: Vợt Cầu Lông Yonex Astrox 100ZZ Kurenai" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Danh mục <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{categoryId}" required>
                                <option value="">-- Chọn danh mục --</option>
                                <option th:each="cat : ${categories}" th:value="${cat.categoryId}" th:text="${cat.name}">Vợt cầu lông</option>
                            </select>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Mã SKU sản phẩm <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{sku}" placeholder="Ví dụ: YNX-AX100ZZ" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}"></div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Giá bán (VNĐ) <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" th:field="*{price}" placeholder="4250000" min="0" step="1000" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                        </div>

                        <div class="col-md-4" th:if="${productRequest.productId == null}">
                            <label class="form-label small fw-bold">Tồn kho ban đầu</label>
                            <input type="number" class="form-control" th:field="*{initialStock}" placeholder="10" min="0">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Tải lên hình ảnh sản phẩm</label>
                            <input type="file" name="imageFiles" class="form-control" multiple accept="image/png, image/jpeg, image/jpg, image/webp">
                            <div class="form-text small">Hỗ trợ các định dạng JPG, PNG, WEBP (tối đa 5MB/ảnh).</div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Hoặc đường dẫn ảnh trực tiếp (URL)</label>
                            <input type="text" class="form-control" th:field="*{imageUrl}" placeholder="https://... hoặc /images/products/...">
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold">Mô tả chi tiết sản phẩm</label>
                            <textarea class="form-control" th:field="*{description}" rows="6" 
                                      placeholder="Nhập thông tin chi tiết về thông số kỹ thuật, công nghệ, độ cứng thân vợt, đối tượng chơi phù hợp..."></textarea>
                        </div>

                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" th:field="*{active}" id="activeCheck">
                                <label class="form-check-label fw-bold small" for="activeCheck">
                                    Đang kinh doanh (Hiển thị cho khách hàng xem và mua trên website)
                                </label>
                            </div>
                        </div>

                        <div class="col-12 mt-4 pt-3 border-top">
                            <button type="submit" class="btn btn-yonex-primary rounded-pill px-5 py-2">
                                <i class="bi bi-save me-1"></i> Lưu sản phẩm
                            </button>
                            <a th:href="@{/admin/products}" class="btn btn-light rounded-pill px-4 py-2 ms-2">Hủy bỏ</a>
                        </div>
                    </div>
                </form>
            </div>

        </div>
    </div>
</body>
</html>
