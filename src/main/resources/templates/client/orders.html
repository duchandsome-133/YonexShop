<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <div th:replace="~{layout/main :: mainLayout(~{::#ordersListContent})}">
        <div id="ordersListContent" class="container my-4">

            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Trang chủ</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/profile}" class="text-decoration-none">Tài khoản</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Đơn hàng của tôi</li>
                </ol>
            </nav>

            <h3 class="fw-bold mb-4 text-navy"><i class="bi bi-bag-check me-2 text-primary"></i>Lịch Sử Đơn Hàng Của Bạn</h3>

            <div class="row g-4" th:if="${not #lists.isEmpty(orders)}">
                <div class="col-12" th:each="order : ${orders}">
                    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-3">
                        <div class="d-flex flex-wrap justify-content-between align-items-center border-bottom pb-3 mb-3 gap-2">
                            <div>
                                <span class="fw-bold fs-5 text-dark me-2" th:text="'Mã đơn: #' + ${order.orderCode}">#YNX12345</span>
                                <span class="text-muted small" th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}">22/11/2026</span>
                            </div>
                            <div>
                                <span class="status-badge" th:classappend="'status-' + ${order.orderStatus.name()}" 
                                      th:text="${order.orderStatus.displayName}">Chờ xác nhận</span>
                            </div>
                        </div>

                        <!-- Items snapshot -->
                        <div class="mb-3">
                            <div class="d-flex align-items-center gap-3 py-2" th:each="item : ${order.items}">
                                <div class="flex-grow-1">
                                    <strong class="text-dark" th:text="${item.productNameSnapshot}">Tên SP</strong>
                                    <span class="text-muted small ms-2" th:text="'(SKU: ' + ${item.skuSnapshot} + ')'">SKU</span>
                                    <span class="text-secondary small ms-2" th:text="'x ' + ${item.quantity}">x 1</span>
                                </div>
                                <div class="fw-bold text-dark" 
                                     th:text="${#numbers.formatDecimal(item.lineTotal, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                    0 đ
                                </div>
                            </div>
                        </div>

                        <div class="d-flex flex-wrap justify-content-between align-items-center border-top pt-3 gap-2">
                            <div class="small text-muted">
                                Người nhận: <strong class="text-dark" th:text="${order.recipientName}">Tên</strong> | 
                                SĐT: <strong class="text-dark" th:text="${order.recipientPhone}">090...</strong>
                            </div>
                            <div class="d-flex align-items-center gap-3">
                                <div>
                                    <span class="small text-muted me-1">Tổng thanh toán:</span>
                                    <span class="fs-5 fw-bold text-primary" 
                                          th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                        0 đ
                                    </span>
                                </div>
                                <a th:href="@{'/orders/' + ${order.orderCode}}" class="btn btn-outline-dark rounded-1 btn-sm px-3 text-uppercase fw-bold">
                                    Chi tiết <i class="bi bi-chevron-right ms-1"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Empty Orders -->
            <div class="card border-0 shadow-sm text-center p-5 rounded-4 bg-white" th:if="${#lists.isEmpty(orders)}">
                <i class="bi bi-bag-x fs-1 text-muted mb-3"></i>
                <h5 class="fw-bold">Bạn chưa có đơn hàng nào</h5>
                <p class="text-muted small">Hãy dạo xem cửa hàng và chọn cho mình các sản phẩm Yonex ưng ý nhé!</p>
                <div class="mt-2">
                    <a th:href="@{/products}" class="btn btn-yonex-primary rounded-pill px-4">Mua sắm ngay</a>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
