<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="adminLayout(adminContent, activeNav)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' - Quản Trị Yonex Shop' : 'Quản Trị Hệ Thống - Yonex Shop'}">Quản Trị Yonex</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <div class="d-flex">
        <!-- Admin Sidebar -->
        <aside class="admin-sidebar d-flex flex-column flex-shrink-0 p-3" style="width: 260px;">
            <a th:href="@{/admin/dashboard}" class="d-flex align-items-center gap-2 mb-4 text-decoration-none px-2 text-white">
                <span class="brand-badge">YONEX</span>
                <span class="fs-5 fw-bold text-white">PORTAL</span>
            </a>

            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a th:href="@{/admin/dashboard}" class="nav-link" th:classappend="${activeNav == 'dashboard' ? 'active' : ''}">
                        <i class="bi bi-speedometer2"></i> Tổng quan
                    </a>
                </li>
                <li>
                    <a th:href="@{/admin/orders}" class="nav-link" th:classappend="${activeNav == 'orders' ? 'active' : ''}">
                        <i class="bi bi-receipt"></i> Đơn hàng
                    </a>
                </li>
                <li>
                    <a th:href="@{/admin/inventory}" class="nav-link" th:classappend="${activeNav == 'inventory' ? 'active' : ''}">
                        <i class="bi bi-boxes"></i> Tồn kho
                    </a>
                </li>
                <li sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/admin/products}" class="nav-link" th:classappend="${activeNav == 'products' ? 'active' : ''}">
                        <i class="bi bi-bag"></i> Sản phẩm
                    </a>
                </li>
                <li sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/admin/categories}" class="nav-link" th:classappend="${activeNav == 'categories' ? 'active' : ''}">
                        <i class="bi bi-tags"></i> Danh mục
                    </a>
                </li>
                <li sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/admin/users}" class="nav-link" th:classappend="${activeNav == 'users' ? 'active' : ''}">
                        <i class="bi bi-people"></i> Khách hàng
                    </a>
                </li>
                <li sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/admin/staff}" class="nav-link" th:classappend="${activeNav == 'staff' ? 'active' : ''}">
                        <i class="bi bi-person-badge"></i> Nhân viên
                    </a>
                </li>
                <li sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/admin/reports}" class="nav-link" th:classappend="${activeNav == 'reports' ? 'active' : ''}">
                        <i class="bi bi-graph-up"></i> Báo cáo
                    </a>
                </li>
            </ul>

            <hr class="border-secondary">
            <div class="px-2">
                <a th:href="@{/}" class="btn btn-sm btn-outline-light w-100 rounded-pill mb-2">
                    <i class="bi bi-arrow-left me-1"></i> Xem Website
                </a>
            </div>
        </aside>

        <!-- Main Workspace -->
        <div class="flex-grow-1 d-flex flex-column min-vh-100">
            <!-- Top bar -->
            <header class="navbar navbar-light bg-white border-bottom px-4 py-3 sticky-top">
                <div class="d-flex align-items-center gap-2">
                    <h5 class="mb-0 fw-bold" th:text="${pageTitle != null ? pageTitle : (activeNav == 'dashboard' ? 'Tổng Quan Hoạt Động' : (activeNav == 'orders' ? 'Quản Lý Đơn Hàng' : (activeNav == 'inventory' ? 'Quản Lý Tồn Kho' : (activeNav == 'products' ? 'Quản Lý Sản Phẩm' : (activeNav == 'categories' ? 'Quản Lý Danh Mục' : (activeNav == 'users' ? 'Quản Lý Khách Hàng' : (activeNav == 'staff' ? 'Quản Lý Nhân Viên' : (activeNav == 'reports' ? 'Báo Cáo Doanh Thu' : 'Bảng Điều Khiển'))))))))}">Bảng Điều Khiển</h5>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <span class="badge bg-primary px-3 py-2" sec:authorize="hasRole('ADMIN')">QUẢN TRỊ VIÊN</span>
                    <span class="badge bg-secondary px-3 py-2" sec:authorize="hasRole('STAFF') and !hasRole('ADMIN')">NHÂN VIÊN</span>
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle rounded-pill" type="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-1"></i>
                            <span sec:authentication="name">User</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                            <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person me-2"></i>Hồ sơ</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post">
                                    <button class="dropdown-item text-danger" type="submit">
                                        <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </header>

            <!-- Alerts -->
            <div class="container-fluid px-4 mt-3" th:if="${successMessage != null or errorMessage != null}">
                <div class="alert alert-success alert-dismissible fade show shadow-sm" role="alert" th:if="${successMessage}">
                    <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}">Thao tác thành công</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert" th:if="${errorMessage}">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}">Đã xảy ra lỗi</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            </div>

            <!-- Page Body -->
            <main class="container-fluid px-4 py-3 flex-grow-1">
                <div th:replace="${adminContent}"></div>
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
