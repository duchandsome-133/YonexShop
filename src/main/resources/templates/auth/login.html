<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <div th:replace="~{layout/main :: html}" th:with="content=~{::#loginContent}">
        <div id="loginContent" class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                        <div class="text-center mb-4">
                            <span class="brand-badge fs-6 px-3 py-1">YONEX</span>
                            <h3 class="fw-bold mt-3 text-navy">Đăng Nhập</h3>
                            <p class="text-muted small">Đăng nhập tài khoản để quản lý đơn hàng và giỏ hàng</p>
                        </div>

                        <!-- Login Form -->
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Địa chỉ Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                    <input type="email" name="email" class="form-control border-start-0" placeholder="name@example.com" required autofocus>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small fw-bold">Mật khẩu</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                    <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required>
                                </div>
                            </div>

                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-yonex-primary btn-lg rounded-pill py-2">
                                    Đăng Nhập
                                </button>
                            </div>

                            <div class="text-center small text-muted">
                                Chưa có tài khoản? <a th:href="@{/register}" class="text-primary fw-semibold text-decoration-none">Đăng ký ngay</a>
                            </div>
                        </form>

                        <!-- Demo credentials badge for easy testing -->
                        <div class="mt-4 p-3 bg-light rounded-3 small border">
                            <div class="fw-bold text-dark mb-1"><i class="bi bi-info-circle me-1 text-primary"></i> Tài khoản Demo Development:</div>
                            <div class="text-muted">• <strong>Admin:</strong> admin@yonexshop.vn / Password@123</div>
                            <div class="text-muted">• <strong>Nhân viên:</strong> staff@yonexshop.vn / Password@123</div>
                            <div class="text-muted">• <strong>Khách hàng:</strong> customer@yonexshop.vn / Password@123</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
