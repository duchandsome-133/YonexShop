<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <div th:replace="~{layout/main :: mainLayout(~{::#registerContent})}">
        <div id="registerContent" class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-6">
                    <div class="card border rounded-1 shadow-sm p-4 p-md-5 bg-white">
                        <div class="text-center mb-4">
                            <div class="d-inline-flex align-items-center gap-2 mb-2">
                                <div class="yy-logo-badge">
                                    <span class="yy-circle green">Y</span>
                                    <span class="yy-circle blue">Y</span>
                                </div>
                                <span class="yonex-wordmark">YONEX</span>
                            </div>
                            <h4 class="fw-bold text-uppercase mt-2">Tạo Tài Khoản Mới</h4>
                            <p class="text-muted small">Đăng ký để mua sắm và nhận các đặc quyền bảo hành từ Yonex Shop</p>
                        </div>

                        <!-- Register Form -->
                        <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-uppercase text-muted">Họ và tên <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light rounded-1 border-end-0"><i class="bi bi-person text-muted"></i></span>
                                    <input type="text" th:field="*{fullName}" class="form-control rounded-1 border-start-0" placeholder="Nguyễn Văn A" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-uppercase text-muted">Địa chỉ Email <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light rounded-1 border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                    <input type="email" th:field="*{email}" class="form-control rounded-1 border-start-0" placeholder="email@example.com" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-uppercase text-muted">Số điện thoại <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light rounded-1 border-end-0"><i class="bi bi-telephone text-muted"></i></span>
                                    <input type="text" th:field="*{phone}" class="form-control rounded-1 border-start-0" placeholder="0901234567" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-uppercase text-muted">Mật khẩu (tối thiểu 6 ký tự) <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light rounded-1 border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                    <input type="password" th:field="*{password}" class="form-control rounded-1 border-start-0" placeholder="••••••••" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small fw-bold text-uppercase text-muted">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light rounded-1 border-end-0"><i class="bi bi-lock-fill text-muted"></i></span>
                                    <input type="password" th:field="*{confirmPassword}" class="form-control rounded-1 border-start-0" placeholder="••••••••" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                            </div>

                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-yonex-primary py-2 text-uppercase">
                                    Đăng Ký Tài Khoản
                                </button>
                            </div>

                            <div class="text-center small text-muted">
                                Đã có tài khoản? <a th:href="@{/login}" class="text-primary fw-bold text-decoration-none">Đăng nhập</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
