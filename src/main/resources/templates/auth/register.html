<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <div th:replace="~{layout/main :: html}" th:with="content=~{::#registerContent}">
        <div id="registerContent" class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-6">
                    <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                        <div class="text-center mb-4">
                            <span class="brand-badge fs-6 px-3 py-1">YONEX</span>
                            <h3 class="fw-bold mt-3 text-navy">Tạo Tài Khoản Mới</h3>
                            <p class="text-muted small">Đăng ký để mua sắm và nhận các ưu đãi độc quyền từ Yonex Shop</p>
                        </div>

                        <!-- Register Form -->
                        <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Họ và tên <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                                    <input type="text" th:field="*{fullName}" class="form-control border-start-0" placeholder="Nguyễn Văn A" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold">Địa chỉ Email <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                    <input type="email" th:field="*{email}" class="form-control border-start-0" placeholder="email@example.com" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold">Số điện thoại <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-telephone text-muted"></i></span>
                                    <input type="text" th:field="*{phone}" class="form-control border-start-0" placeholder="0901234567" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold">Mật khẩu (tối thiểu 6 ký tự) <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                    <input type="password" th:field="*{password}" class="form-control border-start-0" placeholder="••••••••" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small fw-bold">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill text-muted"></i></span>
                                    <input type="password" th:field="*{confirmPassword}" class="form-control border-start-0" placeholder="••••••••" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                            </div>

                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-yonex-primary btn-lg rounded-pill py-2">
                                    Đăng Ký Tài Khoản
                                </button>
                            </div>

                            <div class="text-center small text-muted">
                                Đã có tài khoản? <a th:href="@{/login}" class="text-primary fw-semibold text-decoration-none">Đăng nhập</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
